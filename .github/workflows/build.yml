name: Build launcher

# Push a tag like v0.2.0 to build the launcher for Windows and Apple Silicon Macs
# and publish both zips as a GitHub release. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: JackrabbitLauncher-windows.zip
          - os: macos-14            # Apple Silicon
            asset: JackrabbitLauncher-mac-mseries.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (install, update, rollback)
        run: python launcher.py --selftest

      - name: Update-flow test against a fake GitHub
        run: python test_update_flow.py

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = open("launcher.py", encoding="utf-8").read()
          src = re.sub(r'VERSION = "[^"]*"', f'VERSION = "{version}"', src, count=1)
          open("launcher.py", "w", encoding="utf-8").write(src)

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build the app
        run: python build.py

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/JackrabbitLauncher.exe -DestinationPath ${{ matrix.asset }}

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/JackrabbitLauncher.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*.zip
          --repo "$GITHUB_REPOSITORY"
          --title "Jackrabbit Launcher $GITHUB_REF_NAME"
          --generate-notes
